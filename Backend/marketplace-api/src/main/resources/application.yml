spring:
  application:
    name: marketplace-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DATABASE_USERNAME:marketplace}
    password: ${DATABASE_PASSWORD:marketplace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

marketplace:
  security:
    jwt:
      issuer: ${JWT_ISSUER:marketplace-api}
      secret: ${JWT_SECRET:marketplace-development-secret-key-change-before-production}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@marketplace.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
      full-name: ${BOOTSTRAP_ADMIN_NAME:Marketplace Administrator}
