spring:
  datasource:
    url: jdbc:h2:mem:marketplace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

marketplace:
  security:
    jwt:
      issuer: marketplace-api-test
      secret: marketplace-test-secret-key-with-more-than-thirty-two-characters
      access-token-ttl: PT1H
    cors:
      allowed-origins:
        - http://localhost:4200
  bootstrap:
    admin:
      enabled: true
      email: admin@marketplace.local
      password: Admin123!
      full-name: Marketplace Administrator
